<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Methodist AHU Inspection Repository</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#005941">
<!-- SheetJS: parses the dropped Excel/CSV asset list in-browser (no upload to a server) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --forest:#005941;
    --teal:#009470;
    --teal-light:#e5f5f1;
    --ink:#1c2624;
    --ink-soft:#5a6b67;
    --paper:#ffffff;
    --bg:#f2f5f4;
    --line:#d9e2e0;
    --amber:#b9770e;
    --amber-bg:#fdf2e0;
    --red:#a6362c;
    --red-bg:#faeceb;
    --green:#1c7a4e;
    --green-bg:#e9f6ef;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  header{background:var(--forest);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 6px rgba(0,0,0,.15);}
  header .brand{display:flex;align-items:center;gap:10px;}
  header .brand .mark{width:34px;height:34px;border-radius:8px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;}
  header .brand h1{font-size:15px;margin:0;font-weight:600;line-height:1.25;}
  header .brand .sub{font-size:11px;opacity:.8;font-weight:400;}
  header .who{font-size:12px;text-align:right;opacity:.9;}
  header .who button{background:rgba(255,255,255,.15);border:none;color:#fff;font-size:11px;padding:5px 10px;border-radius:6px;margin-left:8px;cursor:pointer;}

  nav{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:60px;z-index:40;}
  nav button{border:none;background:transparent;padding:12px 16px;font-size:13px;color:var(--ink-soft);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;font-weight:500;}
  nav button.active{color:var(--forest);border-bottom-color:var(--teal);font-weight:700;}
  nav button:hover{color:var(--forest);}

  main{max-width:960px;margin:0 auto;padding:18px 14px 60px;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .card h2{font-size:15px;margin:0 0 4px;color:var(--forest);}
  .card .hint{font-size:12px;color:var(--ink-soft);margin:0 0 14px;}

  label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;margin-top:12px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=date],input[type=number],select,textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:-1px;border-color:var(--teal);}
  textarea{min-height:70px;resize:vertical;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:150px;}
  .checkrow{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap;}
  .checkrow label{display:flex;align-items:center;gap:6px;font-size:13px;margin:0;font-weight:500;color:var(--ink);}
  .checkrow input[type=checkbox]{width:16px;height:16px;}

  .checklist-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .checklist-item:last-child{border-bottom:none;}
  .checklist-item .txt{flex:1;font-size:13px;line-height:1.4;}
  .pf-toggle{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-shrink:0;}
  .pf-toggle button{border:none;background:#fff;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink-soft);}
  .pf-toggle button.pass.on{background:var(--green-bg);color:var(--green);}
  .pf-toggle button.fail.on{background:var(--red-bg);color:var(--red);}
  .pf-toggle button.na.on{background:#eee;color:#777;}

  .section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--teal);margin:20px 0 6px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  table th,table td{border:1px solid var(--line);padding:7px 8px;text-align:left;}
  table th{background:var(--teal-light);color:var(--forest);font-size:11px;text-transform:uppercase;}

  .btn{display:inline-block;background:var(--teal);color:#fff;border:none;padding:10px 18px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn:hover{background:#007a5c;}
  .btn.secondary{background:#fff;color:var(--forest);border:1px solid var(--forest);}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .btn.small{padding:6px 12px;font-size:12px;}
  .btn.danger{background:var(--red);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge.pass{background:var(--green-bg);color:var(--green);}
  .badge.fail{background:var(--red-bg);color:var(--red);}
  .badge.overdue{background:var(--red-bg);color:var(--red);}
  .badge.due-soon{background:var(--amber-bg);color:var(--amber);}
  .badge.ok{background:var(--green-bg);color:var(--green);}
  .badge.scan{background:#eee;color:#666;}
  .badge.digital{background:var(--teal-light);color:var(--forest);}

  .rep-list{display:flex;flex-direction:column;gap:8px;}
  .rep-row{border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:#fff;}
  .rep-row:hover{border-color:var(--teal);}
  .rep-row .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .rep-row .top strong{font-size:13.5px;}
  .rep-row .meta{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}

  .filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .filterbar select,.filterbar input{width:auto;flex:1;min-width:120px;}

  .pin-gate{max-width:360px;margin:80px auto;text-align:center;}
  .pin-gate .mark{width:56px;height:56px;border-radius:14px;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;margin:0 auto 14px;}
  .pin-gate input{text-align:center;font-size:20px;letter-spacing:6px;}
  .pin-gate .role-pick{display:flex;gap:8px;margin-top:14px;}
  .pin-gate .role-pick button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer;font-weight:600;}
  .pin-gate .role-pick button.sel{border-color:var(--teal);background:var(--teal-light);color:var(--forest);}
  .err{color:var(--red);font-size:12px;margin-top:8px;min-height:16px;}

  .modal-bg{position:fixed;inset:0;background:rgba(10,20,18,.5);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;z-index:100;}
  .modal{background:#fff;border-radius:12px;max-width:640px;width:100%;padding:20px;margin-top:30px;}
  .modal .close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);}

  .banner{background:var(--amber-bg);border:1px solid #f0d29a;color:#7a5410;font-size:12px;padding:10px 12px;border-radius:8px;margin-bottom:14px;}
  .banner.cloud{background:#eef2ff;border-color:#c7d2fe;color:#3730a3;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--forest);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:200;box-shadow:0 4px 14px rgba(0,0,0,.25);}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center;}
  .stat .n{font-size:22px;font-weight:800;color:var(--forest);}
  .stat .l{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .file-drop{border:2px dashed var(--line);border-radius:8px;padding:18px;text-align:center;cursor:pointer;font-size:13px;color:var(--ink-soft);}
  .file-drop:hover{border-color:var(--teal);color:var(--forest);}
  .file-preview{margin-top:10px;font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;}
  .file-preview img{max-width:70px;max-height:70px;border-radius:4px;border:1px solid var(--line);}

  .qr-label-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:0 4px;}
  .qr-plate{background:#f4f4f2;border:1px solid #b8bcb9;border-radius:4px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;page-break-inside:avoid;}
  .qr-plate-info{flex:1;min-width:0;}
  .qr-plate-id{font-weight:800;font-size:13px;letter-spacing:.02em;color:#1c2624;margin-bottom:3px;}
  .qr-plate-field{font-size:10.5px;font-weight:700;letter-spacing:.02em;color:#3a423f;text-transform:uppercase;line-height:1.5;}
  .qr-plate-code{flex-shrink:0;width:70px;}
  .qr-plate-code svg{width:100%;height:auto;display:block;}

  @media print{
    header,nav,.filterbar,.btn,.no-print{display:none !important;}
    body{background:#fff;}
    main{max-width:100%;padding:0;}
  }
</style>
</head>
<body>

<div id="gate"></div>
<div id="app" style="display:none">
  <header>
    <div class="brand">
      <div class="mark">M</div>
      <div>
        <h1>Methodist AHU Inspection Repository</h1>
        <div class="sub">Hunton Services &middot; Compliance Records</div>
      </div>
    </div>
    <div class="who" id="whoBox"></div>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="toastHost"></div>
<div id="modalHost"></div>

<script>

/* ---- Embedded QR code generator (qrcode-generator by Kazuhiko Arase, MIT license) ---- */
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';

  // ---------------- Storage layer ----------------
  const Store = {
    async list(){
      return JSON.parse(localStorage.getItem(LS_RECORDS) || "[]");
    },
    async save(rec){
      const all = await this.list();
      if(rec.id){
        const i = all.findIndex(r=>r.id===rec.id);
        if(i>-1) all[i]=rec; else all.push(rec);
      } else {
        rec.id = "r_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
        rec.createdAt = new Date().toISOString();
        all.push(rec);
      }
      this._write(all);
      return rec;
    },
    async remove(id){
      const all = (await this.list()).filter(r=>r.id!==id);
      this._write(all);
    },
    _write(all){
      try{ localStorage.setItem(LS_RECORDS, JSON.stringify(all)); }
      catch(e){ toast("Storage full — export/backup data, or set up cloud sync (see Settings)."); }
    },
    async tags(){
      return JSON.parse(localStorage.getItem(LS_TAGS) || "[]");
    },
    async addTag(t){
      const tags = await this.tags();
      if(!tags.includes(t)){ tags.push(t); tags.sort(); localStorage.setItem(LS_TAGS, JSON.stringify(tags)); }
    },
    async units(){
      return JSON.parse(localStorage.getItem(LS_UNITS) || "[]");
    },
    async upsertUnits(list){
      const existing = await this.units();
      list.forEach(u=>{
        const i = existing.findIndex(e=>e.tag===u.tag && e.campus===u.campus);
        if(i>-1) existing[i] = Object.assign({}, existing[i], u);
        else existing.push(u);
      });
      localStorage.setItem(LS_UNITS, JSON.stringify(existing));
      return existing;
    },
    async findUnit(campus, tag){
      const all = await this.units();
      return all.find(u=>u.campus===campus && (u.tag||"").toLowerCase()===(tag||"").toLowerCase()) || null;
    }
  };

  function fmtDate(d){
    if(!d) return "—";
    const dt = new Date(d+"T00:00:00");
    if(isNaN(dt)) return d;
    return dt.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
  }
  function addMonths(dateStr, n){
    const d = new Date(dateStr+"T00:00:00");
    d.setMonth(d.getMonth()+n);
    return d.toISOString().slice(0,10);
  }
  function daysBetween(a,b){
    return Math.round((new Date(b)-new Date(a))/86400000);
  }

  // ---------------- Nav / shell ----------------
  const TABS_ADMIN = [
    ["dashboard","Dashboard"],["new","New Inspection"],["import","Import Backlog"],["repo","Repository"],

  ];

  function renderShell(){
    document.getElementById("gate").innerHTML="";

      `${ROLE==="admin"?"Tech / Admin":"Viewer (read-only)"}<button id="logoutBtn">Switch</button>`;

    };
    const navEl = document.getElementById("nav");

      `<button data-tab="${id}" class="${TAB===id?'active':''}">${label}</button>`).join("");

  async function boot(){
    RECORDS = await Store.list();
    TAGS = await Store.tags();
    UNITS = await Store.units();
    renderShell();

  function renderMain(){
    const main = document.getElementById("main");
    main.innerHTML = "";
    if(TAB==="dashboard") return renderDashboard(main);
    if(TAB==="new") return renderNewInspection(main);
    if(TAB==="import") return renderImportBacklog(main);
    if(TAB==="repo") return renderRepository(main);
    if(TAB==="compliance") return renderCompliance(main);
    if(TAB==="settings") return renderSettings(main);
    if(TAB==="labels") return renderLabels(main);

  // ---------------- Dashboard (critical issues) ----------------
  function issueFailedItems(r){
    const items = [];
    if(r.annualChecklist) r.annualChecklist.forEach(i=>{ if(i.result==="fail") items.push(i.item); });
    if(r.qsChecklist) r.qsChecklist.forEach(i=>{ if(i.result==="fail") items.push(i.item); });
    return items;
  }

  function renderDashboard(main){
    const openIssues = RECORDS.filter(r=> r.overallResult==="fail" && (r.status||"open")!=="resolved")
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const resolvedIssues = RECORDS.filter(r=> r.overallResult==="fail" && r.status==="resolved")
      .sort((a,b)=>(b.resolvedAt||"").localeCompare(a.resolvedAt||""));
    const needsReview = RECORDS.filter(r=> r.overallResult==="unknown")
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""));

    const issueRow = (r, resolved)=>{
      const failed = issueFailedItems(r);
      return `<div class="rep-row" style="cursor:default;">
        <div class="top">
          <strong>${CAMPUS_META[r.campus].label} — ${r.ahuTag}</strong>
          <span class="badge ${resolved?'ok':'fail'}">${resolved?'Resolved':'Open'}</span>
        </div>
        <div class="meta">${fmtDate(r.date)} &middot; ${(r.types||[]).map(t=>TYPE_LABEL[t]).join(", ")} &middot; Tech: ${r.technician||"—"} &middot; ${r.source==='scan'?'Scanned backlog':'Digital'}</div>
        ${failed.length ? `<ul style="font-size:12.5px;margin:8px 0 0;padding-left:18px;color:var(--red);">${failed.map(f=>`<li>${f}</li>`).join("")}</ul>` : ""}
        ${r.notes ? `<p style="font-size:12.5px;margin:8px 0 0;color:var(--ink-soft);"><b>Notes:</b> ${r.notes}</p>` : ""}
        ${resolved ? `<p style="font-size:12px;color:var(--green);margin:8px 0 0;"><b>Resolved ${fmtDate(r.resolvedAt)}:</b> ${r.resolvedNotes||"—"}</p>` : ""}
        ${ROLE==="admin" ? (resolved
            ? `<button class="btn ghost small" data-reopen="${r.id}" style="margin-top:8px;">Reopen</button>`
            : `<button class="btn small" data-resolve="${r.id}" style="margin-top:8px;">Mark Resolved</button>`)
          : ""}
      </div>`;
    };

    main.innerHTML = `
      <div class="card">
        <h2>Dashboard</h2>
        <p class="hint">Critical issues and deficiencies found during inspections, and whether they've been closed out — this is what an auditor or Methodist facilities lead will want to see first.</p>
        <div class="stat-grid">
          <div class="stat"><div class="n" style="color:var(--red);">${openIssues.length}</div><div class="l">Open issues</div></div>
          <div class="stat"><div class="n" style="color:var(--amber);">${needsReview.length}</div><div class="l">Needs review</div></div>
          <div class="stat"><div class="n" style="color:var(--green);">${resolvedIssues.length}</div><div class="l">Resolved</div></div>
        </div>
      </div>
      <div class="card">
        <h2>Open Issues</h2>
        <div class="rep-list">${openIssues.length ? openIssues.map(r=>issueRow(r,false)).join("") : `<p style="font-size:13px;color:var(--ink-soft);">No open issues logged.</p>`}</div>
      </div>
      ${needsReview.length ? `<div class="card"><h2>Needs Review</h2><p class="hint">Backlog records imported with an unclear or illegible result — confirm pass/fail against the attached scan.</p><div class="rep-list">${needsReview.map(r=>issueRow(r,false)).join("")}</div></div>` : ""}
      <div class="card">
        <h2>Resolved</h2>
        <div class="rep-list">${resolvedIssues.length ? resolvedIssues.map(r=>issueRow(r,true)).join("") : `<p style="font-size:13px;color:var(--ink-soft);">Nothing resolved yet.</p>`}</div>
      </div>
    `;
    main.querySelectorAll("[data-resolve]").forEach(btn=>{ btn.onclick=()=>resolveIssue(btn.dataset.resolve); });
    main.querySelectorAll("[data-reopen]").forEach(btn=>{ btn.onclick=()=>reopenIssue(btn.dataset.reopen); });
  }

  async function resolveIssue(id){
    const note = window.prompt("Resolution notes — what was done to fix this:", "");
    if(note === null) return;
    const rec = RECORDS.find(r=>r.id===id);
    if(!rec) return;
    rec.status = "resolved";
    rec.resolvedAt = new Date().toISOString().slice(0,10);
    rec.resolvedNotes = note;
    await Store.save(rec);
    RECORDS = await Store.list();
    toast("Marked resolved.");
    renderShell();
  }
  async function reopenIssue(id){
    const rec = RECORDS.find(r=>r.id===id);
    if(!rec) return;
    rec.status = "open";
    await Store.save(rec);
    RECORDS = await Store.list();
    toast("Reopened.");
    renderShell();
  }

    function wireAutoDiff(prefix){
      const inEl = document.getElementById(`p_${prefix}_in`);
      const outEl = document.getElementById(`p_${prefix}_out`);
      const diffEl = document.getElementById(`p_${prefix}_diff`);
      if(!inEl || !outEl || !diffEl) return;
      const calc = ()=>{
        const a = parseFloat(inEl.value), b = parseFloat(outEl.value);
        if(!isNaN(a) && !isNaN(b)){
          const d = a - b;
          diffEl.value = Number.isInteger(d) ? String(d) : d.toFixed(2);
        }
      };
      inEl.addEventListener("input", calc);
      outEl.addEventListener("input", calc);
    }

    function checklistHtml(items, prefix){
      return items.map((txt,i)=>`
        <div class="checklist-item">
          <div class="txt">${txt}</div>
          <div class="pf-toggle" data-key="${prefix}_${i}">
            <button type="button" class="pass" data-v="pass">Pass</button>
            <button type="button" class="fail" data-v="fail">Fail</button>
            <button type="button" class="na" data-v="na">N/A</button>
          </div>
        </div>`).join("");
    }
    document.getElementById("main").addEventListener("click",(e)=>{
      const btn = e.target.closest(".pf-toggle button");
      if(!btn) return;
      const toggle = btn.parentElement;
      toggle.querySelectorAll("button").forEach(b=>b.classList.remove("on"));
      btn.classList.add("on");
      toggle.dataset.val = btn.dataset.v;
    });

    document.getElementById("saveInspBtn").onclick = async ()=>{
      const campus = campusSel.value;
      const tag = document.getElementById("f_tag").value.trim();
      const date = document.getElementById("f_date").value;
      const types = [];
      if(document.getElementById("t_q").checked) types.push("quarterly");
      if(document.getElementById("t_s").checked) types.push("semiannual");
      if(document.getElementById("t_a").checked) types.push("annual");
      const tech = document.getElementById("f_tech").value.trim();
      const sig = document.getElementById("f_sig").value.trim();

      if(!tag || !date || types.length===0 || !tech || !sig){
        document.getElementById("saveMsg").textContent = "Please fill AHU tag, date, at least one visit type, technician name, and signature.";
        document.getElementById("saveMsg").style.color = "var(--red)";
        return;
      }

      const collect = (prefix, items)=>{
        const els = document.querySelectorAll(`.pf-toggle[data-key^="${prefix}_"]`);
        return items.map((txt,i)=>{
          const el = document.querySelector(`.pf-toggle[data-key="${prefix}_${i}"]`);
          return {item:txt, result: el ? (el.dataset.val||null) : null};
        });
      };

      const rec = {
        campus, ahuTag: tag, date, types, technician: tech, signature: sig,
        source: "digital",
        annualChecklist: types.includes("annual") ? collect("ann",ANNUAL_CHECKLIST) : null,
        qsChecklist: (types.includes("quarterly")||types.includes("semiannual")) ? collect("qs",QS_CHECKLIST) : null,
        service: types.includes("annual") ? {
          filterDate: val("f_filterDate"), coilDate: val("f_coilDate"),
          beltDate: val("f_beltDate"), uvDate: val("f_uvDate")
        } : null,
        pressure: types.includes("annual") ? {
          cw: {in: val("p_cw_in"), out: val("p_cw_out"), diff: val("p_cw_diff")},
          hw: {in: val("p_hw_in"), out: val("p_hw_out"), diff: val("p_hw_diff")}
        } : null,
        bearing: types.includes("annual") ? {front: val("b_front"), rear: val("b_rear")} : null,
        engineerInitials: document.getElementById("f_eng").value.trim(),
        notes: document.getElementById("f_notes").value.trim(),
        createdBy: tech
      };
      function val(id){ const el=document.getElementById(id); return el ? el.value : ""; }
      rec.unitInfo = UNITS.find(u=>u.campus===campus && (u.tag||"").toLowerCase()===tag.toLowerCase()) || null;

      const hasFail = [rec.annualChecklist, rec.qsChecklist].filter(Boolean).some(list=>list.some(i=>i.result==="fail"));
      rec.overallResult = hasFail ? "fail" : "pass";
      if(hasFail) rec.status = "open";

      await Store.save(rec);
      await Store.addTag(tag);
      RECORDS = await Store.list();
      TAGS = await Store.tags();
      toast("Inspection saved to repository.");
      TAB = "repo";
      renderShell();
    };
  }

  // ---------------- Compliance Report ----------------
  function renderCompliance(main){
    // Build per campus / per AHU tag / per type: last date + next due
    const byUnit = {};
    RECORDS.forEach(r=>{
      const key = r.campus+"|"+r.ahuTag;
      byUnit[key] = byUnit[key] || {campus:r.campus, tag:r.ahuTag, last:{quarterly:null,semiannual:null,annual:null}};
      (r.types||[]).forEach(t=>{
        if(!byUnit[key].last[t] || r.date > byUnit[key].last[t]) byUnit[key].last[t] = r.date;
      });
    });
    const today = new Date().toISOString().slice(0,10);
    const rows = Object.values(byUnit).sort((a,b)=> (a.campus+a.tag).localeCompare(b.campus+b.tag));

    let overdueCount=0, dueSoonCount=0, okCount=0;
    const rowsHtml = rows.map(u=>{
      const cells = ["quarterly","semiannual","annual"].map(type=>{
        const last = u.last[type];
        if(!last) { return `<td><span class="badge overdue">Never logged</span></td>`; }
        const due = addMonths(last, DUE_MONTHS[type]);
        const d = daysBetween(today, due);
        let badge;
        if(d < 0){ badge = `<span class="badge overdue">Overdue ${fmtDate(due)}</span>`; overdueCount++; }
        else if(d <= 21){ badge = `<span class="badge due-soon">Due ${fmtDate(due)}</span>`; dueSoonCount++; }
        else { badge = `<span class="badge ok">OK &middot; due ${fmtDate(due)}</span>`; okCount++; }
        return `<td>${badge}<br><span style="font-size:11px;color:var(--ink-soft);">last: ${fmtDate(last)}</span></td>`;
      });
      return `<tr><td>${CAMPUS_META[u.campus].label}</td><td><b>${u.tag}</b></td>${cells.join("")}</tr>`;
    }).join("");

    main.innerHTML = `
      <div class="card">
        <h2>Compliance Status Report</h2>
        <p class="hint">Next-due dates computed from the most recent logged inspection of each type (quarterly = 3 mo, semi-annual = 6 mo, annual = 12 mo). Use Print for an insurance/regulatory export.</p>
        <div class="stat-grid">
          <div class="stat"><div class="n" style="color:var(--red);">${overdueCount}</div><div class="l">Overdue</div></div>
          <div class="stat"><div class="n" style="color:var(--amber);">${dueSoonCount}</div><div class="l">Due within 21 days</div></div>
          <div class="stat"><div class="n" style="color:var(--green);">${okCount}</div><div class="l">On schedule</div></div>
        </div>
        <button class="btn secondary small no-print" id="printCompliance">Print / Export as PDF</button>
        <div style="overflow-x:auto;margin-top:14px;">
        <table>
          <thead><tr><th>Campus</th><th>AHU Tag</th><th>Quarterly</th><th>Semi-Annual</th><th>Annual</th></tr></thead>
          <tbody>${rows.length ? rowsHtml : `<tr><td colspan="5" style="color:var(--ink-soft);">No inspection records logged yet.</td></tr>`}</tbody>
        </table>
        </div>
      </div>`;
    document.getElementById("printCompliance").onclick = ()=>window.print();
  }

          <li>Share the URL with a Viewer PIN for Methodist staff and auditors, and the Admin PIN with techs.</li>
        </ol>
        <p style="font-size:12px;color:var(--ink-soft);">I can wire this up once you've created the Firebase project — send me the config and I'll do the rest.</p>
      </div>
      <div class="card">
        <h2>Access PINs</h2>
        <p class="hint">Currently hardcoded in the file (<code>PINS</code> near the top): Admin <b>${PINS.admin}</b>, Viewer <b>${PINS.viewer}</b>. Change these before real deployment and before sharing the viewer PIN outside your team.</p>
      </div>
    `;
    // ---- Asset list import ----
    const FIELD_OPTIONS = [
      ["", "— Ignore —"], ["tag","AHU Tag (required)"], ["campus","Campus"],
      ["location","Location / Area"], ["manufacturer","Manufacturer"], ["model","Model"],
      ["serial","Serial Number"], ["installDate","Install Date"], ["notes","Notes"]
    ];
    let assetRows = [], assetHeaders = [];
    const assetDrop = document.getElementById("assetDrop");
    const assetInput = document.getElementById("assetInput");
    assetDrop.onclick = ()=>assetInput.click();
    assetInput.onchange = ()=>{
      const f = assetInput.files[0];
      if(!f) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const wb = XLSX.read(reader.result, {type:"array"});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:"", blankrows:false});
          if(rows.length < 1){ toast("That file looks empty."); return; }
          assetHeaders = rows[0].map(h=>String(h||"").trim());
          assetRows = rows.slice(1);
          renderAssetMap();
        } catch(err){
          toast("Couldn't read that file — try exporting as .xlsx or .csv.");
        }
      };
      reader.readAsArrayBuffer(f);
    };

    function guessField(header){
      const h = header.toLowerCase();
      if(/tag|ahu|unit/.test(h)) return "tag";
      if(/campus|site|facility/.test(h)) return "campus";
      if(/location|area|room|floor/.test(h)) return "location";
      if(/manufactur|make/.test(h)) return "manufacturer";
      if(/model/.test(h)) return "model";
      if(/serial/.test(h)) return "serial";
      if(/install|date/.test(h)) return "installDate";
      if(/note|comment/.test(h)) return "notes";
      return "";
    }

    function renderAssetMap(){
      const host = document.getElementById("assetMapHost");
      host.innerHTML = `
        <div class="section-title">Match your columns</div>
        <table><thead><tr><th>Your column</th><th>Maps to</th></tr></thead>
        <tbody>${assetHeaders.map((h,i)=>`
          <tr><td>${h||"(column "+(i+1)+")"}</td><td>
            <select data-col="${i}" class="mapSel">
              ${FIELD_OPTIONS.map(([v,l])=>`<option value="${v}" ${guessField(h)===v?"selected":""}>${l}</option>`).join("")}
            </select>
          </td></tr>`).join("")}
        </tbody></table>
        <div id="defaultCampusWrap" style="margin-top:10px;">
          <label>If no Campus column is mapped, apply to:</label>
          <select id="defaultCampus"><option value="west">Methodist West</option><option value="cc">Methodist Continuing Care</option></select>
        </div>
        <p style="font-size:12px;color:var(--ink-soft);margin-top:8px;">${assetRows.length} row${assetRows.length===1?"":"s"} detected.</p>
        <button class="btn small" id="confirmImportBtn" style="margin-top:8px;">Import ${assetRows.length} Units</button>
      `;
      document.getElementById("confirmImportBtn").onclick = async ()=>{
        const mapping = {};
        host.querySelectorAll(".mapSel").forEach(sel=>{
          if(sel.value) mapping[sel.value] = parseInt(sel.dataset.col,10);
        });
        if(mapping.tag === undefined){
          toast("Map at least one column to AHU Tag before importing.");
          return;
        }
        const defaultCampus = document.getElementById("defaultCampus").value;
        const units = assetRows.map(row=>{
          const u = {campus: defaultCampus};
          Object.keys(mapping).forEach(field=>{ u[field] = String(row[mapping[field]] ?? "").trim(); });
          return u;
        }).filter(u=>u.tag);
        await Store.upsertUnits(units);
        for(const u of units) await Store.addTag(u.tag);
        UNITS = await Store.units();
        TAGS = await Store.tags();
        toast(`Imported ${units.length} units.`);
        renderSettings(main);
      };
    }

    // ---- QR labels ----
    document.getElementById("genLabelsBtn").onclick = ()=>{
      qrLabelCampus = document.getElementById("qrCampus").value;
      TAB = "labels";
      renderShell();
    };

    document.getElementById("addTagBtn").onclick = async ()=>{
      const t = document.getElementById("newTag").value.trim();
      if(!t) return;
      await Store.addTag(t);
      TAGS = await Store.tags();
      renderSettings(main);
    };
    document.getElementById("exportBtn").onclick = ()=>{
      const blob = new Blob([JSON.stringify({records:RECORDS, tags:TAGS}, null, 2)], {type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "methodist-ahu-repository-backup-"+new Date().toISOString().slice(0,10)+".json";
      a.click();
    };
    document.getElementById("restoreInput").onchange = (e)=>{
      const f = e.target.files[0];
      if(!f) return;
      const reader = new FileReader();
      reader.onload = async ()=>{
        try{
          const data = JSON.parse(reader.result);
          if(data.records){ localStorage.setItem(LS_RECORDS, JSON.stringify(data.records)); }
          if(data.tags){ localStorage.setItem(LS_TAGS, JSON.stringify(data.tags)); }
          RECORDS = await Store.list();
          TAGS = await Store.tags();
          toast("Backup restored.");
          renderShell();
        } catch(err){ toast("Invalid backup file."); }
      };
      reader.readAsText(f);
    };
  }

  // ---------------- Init ----------------
  if(ROLE && (ROLE==="admin"||ROLE==="viewer")){
    boot();
  } else {
    renderGate();
  }

  // Service worker registration (optional, ignored if sw.js absent)
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
</script>
</body>
</html>
